name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          build-tools-version: 34.0.0
          cmake-version: 3.22.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > my-key.jks
          echo "Keystore size: $(wc -c < my-key.jks) bytes"
          keytool -list -keystore my-key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -v

      - name: Clone Go project
        run: git clone https://github.com/hjfisher/SNISPF-HJ-GO.git ../SNISPF-HJ-GO

      - name: Build all architecture libraries from source
        run: |
          cd ../SNISPF-HJ-GO
          
          # arm64-v8a
          export NDK_ROOT=$ANDROID_NDK_ROOT
          export TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android26-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android26-clang++
          export GOOS=android
          export GOARCH=arm64
          export CGO_ENABLED=1
          export CGO_CFLAGS="-O2 -fPIC"
          export CGO_LDFLAGS="-shared"
          go build -buildmode=c-shared -o ../SNISPF-HJ-Android/app/src/main/jniLibs/arm64-v8a/libsnispf.so .
          
          # armeabi-v7a
          export CC=$TOOLCHAIN/bin/armv7a-linux-androideabi26-clang
          export CXX=$TOOLCHAIN/bin/armv7a-linux-androideabi26-clang++
          export GOARCH=arm
          export GOARM=7
          go build -buildmode=c-shared -o ../SNISPF-HJ-Android/app/src/main/jniLibs/armeabi-v7a/libsnispf.so .
          
          # x86_64
          export CC=$TOOLCHAIN/bin/x86_64-linux-android26-clang
          export CXX=$TOOLCHAIN/bin/x86_64-linux-android26-clang++
          export GOARCH=amd64
          unset GOARM
          go build -buildmode=c-shared -o ../SNISPF-HJ-Android/app/src/main/jniLibs/x86_64/libsnispf.so .

      - name: Verify all libraries
        run: |
          ls -la app/src/main/jniLibs/*/libsnispf.so
          file app/src/main/jniLibs/*/libsnispf.so

      - name: Build Release APKs
        run: gradle assembleRelease

      - name: Build Debug APKs
        run: gradle assembleDebug

      - name: Sign and rename APKs
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          SIGNER=$BUILD_TOOLS/apksigner
          TAG="${{ github.ref_name }}"
          
          mkdir -p final
          
          # Sign and rename release APKs
          for apk in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            abi=$(echo "$name" | sed 's/.*-\(arm64-v8a\|armeabi-v7a\|x86_64\).*/\1/')
            if [ "$abi" != "$name" ]; then
              $SIGNER sign --ks my-key.jks --ks-key-alias ${{ secrets.KEY_ALIAS }} --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "final/SNISPF-HJ-ANDROID-${TAG}-release-${abi}.apk" "$apk"
            fi
          done
          
          # Sign and rename debug APKs
          for apk in app/build/outputs/apk/debug/*.apk; do
            name=$(basename "$apk")
            abi=$(echo "$name" | sed 's/.*-\(arm64-v8a\|armeabi-v7a\|x86_64\).*/\1/')
            if [ "$abi" != "$name" ]; then
              $SIGNER sign --ks my-key.jks --ks-key-alias ${{ secrets.KEY_ALIAS }} --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "final/SNISPF-HJ-ANDROID-${TAG}-debug-${abi}.apk" "$apk"
            fi
          done
          
          echo "=== Final APKs ==="
          ls -la final/

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: final/SNISPF-HJ-ANDROID-*-release-*.apk
          retention-days: 30

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: final/SNISPF-HJ-ANDROID-*-debug-*.apk
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: artifacts/release

      - name: Download Debug APKs
        uses: actions/download-artifact@v4
        with:
          name: debug-apks
          path: artifacts/debug

      - name: List artifacts
        run: |
          echo "=== Release APKs ==="
          ls -la artifacts/release/
          echo "=== Debug APKs ==="
          ls -la artifacts/debug/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/release/*.apk
            artifacts/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}