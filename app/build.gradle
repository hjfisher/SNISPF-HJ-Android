apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.snispf.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.snispf.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
    }

    // Build separate APK per architecture
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk false
        }
    }

    // Version code per ABI for Play Store
    applicationVariants.all { variant ->
        def abiVersionMap = [
                'armeabi-v7a': 1,
                'x86': 2,
                'x86_64': 3,
                'arm64-v8a': 4
        ]
        def abi = variant.outputs[0].getFilter(com.android.build.OutputFile.ABI)
        if (abi != null) {
            variant.outputs.each { output ->
                def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
                if (abiFilter != null) {
                    output.versionCodeOverride = abiVersionMap[abiFilter] * 1000000 + android.defaultConfig.versionCode
                    output.outputFileName = "snispf-hj-${variant.versionName}-${abiFilter}.apk"
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
